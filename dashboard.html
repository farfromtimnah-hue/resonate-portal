<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Resonate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Newsreader:opsz,wght@6..72,700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-container":    "#005b96",
            "primary-fixed-dim":    "#9ccaff",
            "on-primary-fixed":     "#001d35",
            "inverse-surface":      "#2e3135",
            "outline-variant":      "#c1c7d1",
            "on-primary":           "#ffffff",
            "surface-variant":      "#e1e2e8",
            "tertiary-fixed-dim":   "#ffb781",
            "secondary-fixed-dim":  "#c5c6d1",
            "on-primary-container": "#abd2ff",
          },
          borderRadius: { "full": "9999px", "DEFAULT": "1rem", "lg": "2rem" },
          fontFamily:   { "jakarta": ["Plus Jakarta Sans","sans-serif"], "newsreader": ["Newsreader","serif"] },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/app.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f1115; color: #c1c7d1; }
    .glass-header { background: rgba(26,29,38,0.85); backdrop-filter: blur(12px); }
    /* Client card grid — static layout only, card inner styles come from app.css */
    #clients-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    @media (max-width: 640px) { #clients-grid { grid-template-columns: 1fr; } }
    /* Background glow */
    .bg-glow-1 { position:fixed; top:-10%; right:-10%; width:500px; height:500px; background:#004370; border-radius:9999px; filter:blur(120px); opacity:0.18; pointer-events:none; z-index:0; }
    .bg-glow-2 { position:fixed; bottom:-10%; left:-10%; width:400px; height:400px; background:#663300; border-radius:9999px; filter:blur(100px); opacity:0.12; pointer-events:none; z-index:0; }
  </style>
</head>
<body class="min-h-screen antialiased">

<!-- Background glow decorations -->
<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- ── Top Nav ─────────────────────────────────────────────── -->
<header class="glass-header sticky top-0 z-50 border-b border-white/5">
  <div class="flex justify-between items-center w-full px-6 md:px-12 max-w-[1200px] mx-auto h-20">
    <!-- Brand + nav links -->
    <div class="flex items-center gap-10">
      <a href="/resonate-portal/dashboard.html"
         class="font-newsreader font-bold text-[22px] tracking-tight text-primary-fixed-dim no-underline"
         style="font-family:'Newsreader',serif; letter-spacing:-0.02em;">
        Resonate
      </a>
      <nav class="hidden md:flex items-center gap-1">
        <a href="/resonate-portal/dashboard.html"
           class="px-4 py-2 rounded-full text-primary-fixed-dim font-semibold text-[13px] bg-primary-container/10 border border-primary-fixed-dim/15">
          Dashboard
        </a>
        <a href="/resonate-portal/archive.html"
           class="px-4 py-2 rounded-full text-outline-variant hover:text-primary-fixed-dim text-[13px] transition-colors">
          Archive
        </a>
      </nav>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button id="new-client-btn"
              class="bg-primary-container text-white px-6 py-2 rounded-full text-[12px] font-semibold uppercase tracking-widest hover:opacity-90 transition-opacity flex items-center gap-2">
        <span class="material-symbols-outlined text-[16px]">add</span>
        New Client
      </button>
      <button id="signout-btn"
              class="text-outline-variant hover:text-primary-fixed-dim text-[12px] uppercase tracking-widest transition-colors px-4 py-2 rounded-full">
        Sign Out
      </button>
    </div>
  </div>
</header>

<!-- ── Main Content ────────────────────────────────────────── -->
<main class="relative z-10 max-w-[1200px] mx-auto px-6 md:px-12 py-12 space-y-10">

  <!-- Page title -->
  <div>
    <h1 id="page-title" class="text-[28px] font-bold text-primary-fixed-dim tracking-tight" style="letter-spacing:-0.02em;">Active Clients</h1>
    <p id="page-subtitle" class="text-outline-variant text-[13px] mt-1"></p>
  </div>

  <!-- Search + Filters -->
  <section class="flex flex-col md:flex-row gap-4 items-start md:items-center">
    <!-- Search -->
    <div class="relative w-full md:w-80">
      <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-outline-variant text-[18px]">search</span>
      <input id="search" type="search"
             class="w-full bg-inverse-surface border-none rounded-full py-3 pl-12 pr-5 text-primary-fixed-dim text-[14px] placeholder:text-outline-variant focus:ring-1 focus:ring-primary-fixed-dim/40 outline-none"
             placeholder="Search clients…">
    </div>

    <!-- Filter pills -->
    <div class="flex items-center gap-3 overflow-x-auto pb-1 flex-shrink-0">
      <select id="filter-status"
              class="bg-inverse-surface text-outline-variant border border-white/5 rounded-full px-5 py-3 text-[12px] font-semibold uppercase tracking-widest focus:ring-1 focus:ring-primary-fixed-dim/40 outline-none cursor-pointer">
        <option value="">All Statuses</option>
        <option value="active">Active</option>
        <option value="in_progress">In Progress</option>
        <option value="waiting_on_client">Waiting on Client</option>
        <option value="review">Review</option>
        <option value="all_complete">All Complete</option>
        <option value="on_hold">On Hold</option>
      </select>
      <select id="filter-lang"
              class="bg-inverse-surface text-outline-variant border border-white/5 rounded-full px-5 py-3 text-[12px] font-semibold uppercase tracking-widest focus:ring-1 focus:ring-primary-fixed-dim/40 outline-none cursor-pointer">
        <option value="">EN &amp; PT</option>
        <option value="en">English</option>
        <option value="pt">Portuguese</option>
      </select>
    </div>
  </section>

  <!-- Client card grid — rendered by dashboard.js -->
  <div id="clients-grid">
    <div class="loading">Loading…</div>
  </div>

  <!-- Archive footer link -->
  <footer class="flex justify-center pt-8 border-t border-white/5">
    <a href="/resonate-portal/archive.html"
       class="text-outline-variant text-[12px] uppercase tracking-widest hover:text-primary-fixed-dim transition-colors flex items-center gap-2 group">
      <span class="material-symbols-outlined text-[18px]">archive</span>
      View Archived Clients
      <span class="material-symbols-outlined text-[16px] transition-transform group-hover:translate-x-1">arrow_forward</span>
    </a>
  </footer>

</main>

<!-- ── Create Client Modal ─────────────────────────────────── -->
<div id="modal-create-client" class="modal">
  <div class="modal__box" style="max-width:560px;">
    <div class="modal__head">
      <span class="modal__title">New Client</span>
      <button type="button" class="modal__close" data-close="modal-create-client">✕</button>
    </div>
    <div class="modal__body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Contact Name *</label>
          <input id="cc-name" type="text" class="form-control" placeholder="First Last">
        </div>
        <div class="form-group">
          <label class="form-label">Business Name</label>
          <input id="cc-business" type="text" class="form-control" placeholder="Company LLC">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input id="cc-email" type="email" class="form-control" placeholder="client@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Language</label>
          <select id="cc-lang" class="form-control">
            <option value="en">English</option>
            <option value="pt">Portuguese</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input id="cc-phone" type="tel" class="form-control" placeholder="+1 555 000 0000">
        </div>
        <div class="form-group">
          <label class="form-label">WhatsApp</label>
          <input id="cc-whatsapp" type="tel" class="form-control" placeholder="+1 555 000 0000">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Website</label>
          <input id="cc-website" type="url" class="form-control" placeholder="https://…">
        </div>
        <div class="form-group">
          <label class="form-label">Overall Status</label>
          <input id="cc-status" type="text" class="form-control" placeholder="Active" value="active">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Address</label>
        <input id="cc-address" type="text" class="form-control" placeholder="City, State">
      </div>
      <div class="form-group">
        <label class="form-label">Other Contact Notes</label>
        <textarea id="cc-notes" class="form-control" rows="2" placeholder="Telegram, preferred contact time, etc."></textarea>
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-close="modal-create-client">Cancel</button>
      <button id="cc-save-btn" class="btn btn--primary">Create Client</button>
    </div>
  </div>
</div>

<script type="module" src="js/dashboard.js?v=2"></script>
</body>
</html>
