# ============================================================
# GitHub Pages deployment — pushes the frontend on every
# commit to main. The worker/ and schema/ directories are
# excluded automatically (GitHub Pages only serves static files).
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:           # also lets you trigger manually from GitHub UI

permissions:
  contents: read
  pages:    write
  id-token: write

concurrency:
  group:    pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url:  ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Upload everything EXCEPT the worker/ and schema/ directories
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
