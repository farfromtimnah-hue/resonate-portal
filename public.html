<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — Resonate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Newsreader:opsz,wght@6..72,700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/app.css?v=4">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8F7F4; color: #414750; }
  </style>
</head>
<body class="min-h-screen antialiased">

<!-- Header -->
<header style="position:sticky; top:0; z-index:50; background:rgba(255,255,255,0.92);
               backdrop-filter:blur(8px); border-bottom:1px solid rgba(0,0,0,0.05);">
  <div style="max-width:720px; margin:0 auto; padding:0 24px; height:56px;
              display:flex; align-items:center; justify-content:space-between;">

    <a href="https://resonatebiz.com" target="_blank" rel="noopener"
       style="font-family:'Newsreader',serif; font-weight:700; font-size:18px;
              color:#001d35; text-decoration:none; letter-spacing:-0.02em;">
      Resonate
    </a>

    <div style="display:flex; align-items:center; gap:6px;">
      <button id="lang-en" class="lang-btn lang-btn--active">EN</button>
      <button id="lang-pt" class="lang-btn">PT</button>
    </div>
  </div>
</header>

<!-- Main -->
<main style="max-width:720px; margin:0 auto; padding:40px 24px 80px;">

  <!-- Loading -->
  <div id="loading" class="loading">Loading…</div>

  <!-- Error -->
  <div id="pub-error" class="hidden" style="text-align:center; padding:64px 24px;
       font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; color:#717781;">
    Project not found.
  </div>

  <!-- Content -->
  <div id="content" class="hidden">

    <!-- Client identity -->
    <div style="margin-bottom:28px;">
      <div id="pub-identity" style="margin-bottom:8px;"></div>
      <p id="pub-subtitle" style="font-family:'Plus Jakarta Sans',sans-serif;
         font-size:13px; color:#717781; margin:0;"></p>
    </div>

    <!-- Project card -->
    <div id="pub-project"></div>

  </div>

</main>

<!-- Footer -->
<footer style="border-top:1px solid rgba(0,0,0,0.05); padding:20px 24px;">
  <p style="text-align:center; font-family:'Plus Jakarta Sans',sans-serif;
     font-size:11px; color:#a0a4ae; letter-spacing:0.06em; text-transform:uppercase; margin:0;">
    Powered by
    <a href="https://resonatebiz.com" target="_blank" rel="noopener"
       style="color:#005b96; text-decoration:none; font-weight:600;">Resonate</a>
  </p>
</footer>

<script type="module" src="js/public.js?v=1"></script>
</body>
</html>
