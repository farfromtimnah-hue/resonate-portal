<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reconciliation — Resonate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Newsreader:opsz,wght@6..72,700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-container":    "#005b96",
            "primary-fixed-dim":    "#9ccaff",
            "on-primary-fixed":     "#001d35",
            "inverse-surface":      "#2e3135",
            "outline-variant":      "#c1c7d1",
            "on-primary":           "#ffffff",
            "surface-variant":      "#e1e2e8",
            "tertiary-fixed-dim":   "#ffb781",
            "secondary-fixed-dim":  "#c5c6d1",
            "on-primary-container": "#abd2ff",
          },
          borderRadius: { "full": "9999px", "DEFAULT": "1rem", "lg": "2rem" },
          fontFamily:   { "jakarta": ["Plus Jakarta Sans","sans-serif"], "newsreader": ["Newsreader","serif"] },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/app.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f1115; color: #c1c7d1; }
    /* Header stacking — same treatment dashboard.html gets from its utility
       classes (sticky top-0 z-50), stated explicitly here so the nav row
       always paints above the fixed bg-glow layers. */
    .glass-header { background: rgba(26,29,38,0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; }
    .glass-header > div { position: relative; z-index: 1; }
    /* app.css declares `.hidden { display: none !important }` (used for the
       loading/content toggles), which also killed the nav's `hidden md:flex`
       idiom at every width — only the wordmark rendered. Restore the desktop
       state with an equally-important, more specific rule. */
    @media (min-width: 768px) {
      .glass-header nav.hidden { display: flex !important; }
      .glass-header button.hidden { display: block !important; }
    }
    .bg-glow-1 { position:fixed; top:-10%; right:-10%; width:500px; height:500px; background:#004370; border-radius:9999px; filter:blur(120px); opacity:0.18; pointer-events:none; z-index:0; }
    .bg-glow-2 { position:fixed; bottom:-10%; left:-10%; width:400px; height:400px; background:#663300; border-radius:9999px; filter:blur(100px); opacity:0.12; pointer-events:none; z-index:0; }
    .books-tab {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      color: #717781;
      background: none; border: none; cursor: pointer;
      padding: 10px 18px; border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .books-tab:hover { color: #9ccaff; }
    .books-tab--active { color: #9ccaff; border-bottom-color: #005b96; }
    .txn-row { display: grid; grid-template-columns: 0.8fr 2fr 0.8fr 1.2fr auto; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .txn-row__head { color: #717781; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 8px 0; }
    @media (max-width: 760px) {
      .txn-row { grid-template-columns: 1fr auto; }
      .txn-row > .txn-cell--optional { display: none; }
    }
  </style>
</head>
<body class="min-h-screen antialiased">

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- ── Mobile Nav Overlay + Drawer ─────────────────────────── -->
<div id="mobile-nav-overlay" class="mobile-nav-overlay"></div>
<div id="mobile-nav-drawer" class="mobile-nav-drawer">
  <a href="dashboard.html" class="mobile-nav-drawer__brand">Resonate</a>
  <a href="dashboard.html" class="mobile-nav-drawer__link">
    <span class="material-symbols-outlined">grid_view</span>Dashboard
  </a>
  <a href="books.html" class="mobile-nav-drawer__link mobile-nav-drawer__link--active">
    <span class="material-symbols-outlined">receipt_long</span>Books
  </a>
  <a href="archive.html" class="mobile-nav-drawer__link">
    <span class="material-symbols-outlined">archive</span>Archive
  </a>
</div>

<!-- ── Top Nav ─────────────────────────────────────────────── -->
<header class="glass-header sticky top-0 z-50 border-b border-white/5">
  <div class="flex justify-between items-center w-full px-6 md:px-12 max-w-[1200px] mx-auto h-20">
    <div class="flex items-center gap-3 md:gap-10">
      <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open navigation">
        <span class="material-symbols-outlined" style="font-size:22px;">menu</span>
      </button>
      <a href="dashboard.html"
         class="font-newsreader font-bold text-[22px] tracking-tight text-primary-fixed-dim no-underline"
         style="font-family:'Newsreader',serif; letter-spacing:-0.02em;">
        Resonate
      </a>
      <nav class="hidden md:flex items-center gap-1">
        <a href="dashboard.html"
           class="px-4 py-2 rounded-full text-outline-variant hover:text-primary-fixed-dim text-[13px] transition-colors">
          Dashboard
        </a>
        <a href="books.html"
           class="px-4 py-2 rounded-full text-primary-fixed-dim font-semibold text-[13px] bg-primary-container/10 border border-primary-fixed-dim/15">
          Books
        </a>
        <a href="archive.html"
           class="px-4 py-2 rounded-full text-outline-variant hover:text-primary-fixed-dim text-[13px] transition-colors">
          Archive
        </a>
      </nav>
    </div>

    <div class="flex items-center gap-3">
      <button id="signout-btn"
              class="text-outline-variant hover:text-primary-fixed-dim text-[12px] uppercase tracking-widest transition-colors px-4 py-2 rounded-full hidden md:block">
        Sign Out
      </button>
    </div>
  </div>
</header>

<script>
(function () {
  var btn     = document.getElementById('mobile-menu-btn');
  var drawer  = document.getElementById('mobile-nav-drawer');
  var overlay = document.getElementById('mobile-nav-overlay');
  function open()  { drawer.classList.add('mobile-nav-drawer--open');  overlay.classList.add('mobile-nav-overlay--open');  document.body.style.overflow='hidden'; }
  function close() { drawer.classList.remove('mobile-nav-drawer--open'); overlay.classList.remove('mobile-nav-overlay--open'); document.body.style.overflow=''; }
  btn.addEventListener('click', open);
  overlay.addEventListener('click', close);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
})();
</script>

<!-- ── Main Content ────────────────────────────────────────── -->
<main class="relative z-10 max-w-[1200px] mx-auto px-6 md:px-12 py-12 space-y-8">

  <!-- Page title + actions -->
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-[28px] font-bold text-primary-fixed-dim tracking-tight" style="letter-spacing:-0.02em;"
          data-i18n="recon_title">Bank Reconciliation</h1>
      <p id="recon-subtitle" class="text-outline-variant text-[13px] mt-1" data-i18n="recon_upload_hint">CSV columns: date, description, amount</p>
    </div>
    <div class="flex items-center gap-3">
      <a href="books.html"
         class="flex items-center gap-1.5 text-outline-variant hover:text-primary-fixed-dim text-[12px] uppercase tracking-widest transition-colors px-4 py-2 rounded-full border border-white/10 no-underline">
        <span class="material-symbols-outlined text-[15px]">receipt_long</span>
        <span data-i18n="books_title">Books &amp; Invoicing</span>
      </a>
      <button id="upload-csv-btn"
              class="bg-primary-container text-white px-6 py-2 rounded-full text-[12px] font-semibold uppercase tracking-widest hover:opacity-90 transition-opacity flex items-center gap-2">
        <span class="material-symbols-outlined text-[16px]">upload_file</span>
        <span data-i18n="recon_upload">Upload CSV</span>
      </button>
      <input id="csv-file-input" type="file" accept=".csv,text/csv" style="display:none">
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex items-center border-b border-white/5">
    <button class="books-tab books-tab--active" data-tab="unmatched"><span data-i18n="recon_tab_unmatched">Unmatched</span> <span id="count-unmatched" class="opacity-60"></span></button>
    <button class="books-tab" data-tab="matched"><span data-i18n="recon_tab_matched">Matched</span> <span id="count-matched" class="opacity-60"></span></button>
    <button class="books-tab" data-tab="excluded"><span data-i18n="recon_tab_excluded">Excluded</span> <span id="count-excluded" class="opacity-60"></span></button>
  </div>

  <!-- Transaction list -->
  <section class="bg-inverse-surface rounded-lg border border-white/5 p-6">
    <div class="txn-row txn-row__head">
      <span data-i18n="recon_col_date">Date</span>
      <span data-i18n="recon_col_description">Description</span>
      <span data-i18n="recon_col_amount">Amount</span>
      <span class="txn-cell--optional" data-i18n="recon_col_match">Matched To</span>
      <span></span>
    </div>
    <div id="txn-list"></div>
    <div id="txn-empty" class="text-outline-variant text-[13px] py-8 text-center hidden"></div>
    <div id="txn-loading" class="loading">Loading…</div>
  </section>

</main>

<!-- ── Match Modal ─────────────────────────────────────────── -->
<div id="modal-match" class="modal">
  <div class="modal__box" style="max-width:480px;">
    <div class="modal__head">
      <span class="modal__title" data-i18n="recon_match_title">Match Transaction</span>
      <button type="button" class="modal__close" data-close="modal-match">✕</button>
    </div>
    <div class="modal__body">
      <div id="match-txn-summary" class="text-outline-variant text-[13px]" style="margin-bottom:14px;"></div>
      <div class="form-group">
        <label class="form-label" data-i18n="recon_match_pick">Match to invoice</label>
        <select id="match-invoice" class="form-control"></select>
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-close="modal-match" data-i18n="cancel">Cancel</button>
      <button id="match-save-btn" class="btn btn--primary" data-i18n="recon_match">Match</button>
    </div>
  </div>
</div>

<script type="module" src="js/reconciliation.js?v=1"></script>
</body>
</html>
