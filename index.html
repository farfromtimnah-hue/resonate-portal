<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resonate Business Systems — Sign In</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Fraunces:wght@400;700&family=Newsreader:opsz,wght@6..72,700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary-container": "#005b96",
            "primary-fixed-dim": "#9ccaff",
            "on-primary-fixed":  "#001d35",
          },
          fontFamily: {
            "fraunces": ["Fraunces", "serif"],
            "jakarta":  ["Plus Jakarta Sans", "sans-serif"],
          }
        }
      }
    }
  </script>

  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; background: #0a1628; }

    /* iOS Safari requires video inside a fixed+overflow:hidden wrapper.
       position:fixed on the video itself causes rendering bugs on iOS. */
    #bg-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      background: #0a1628; /* shows immediately before video loads */
    }
    #bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0a1628;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    #bg-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .pill-input {
      width: 100%;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 9999px;
      color: #0f1115;
      -webkit-text-fill-color: #0f1115;
      padding: 14px 24px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .pill-input::placeholder { color: rgba(15,17,21,0.38); }
    .pill-input:focus {
      background: rgba(255,255,255,0.96);
      border-color: rgba(156,202,255,0.8);
      box-shadow: 0 0 0 3px rgba(0,91,150,0.25);
    }
    /* Prevent browser autofill from overriding text color */
    .pill-input:-webkit-autofill,
    .pill-input:-webkit-autofill:hover,
    .pill-input:-webkit-autofill:focus {
      -webkit-text-fill-color: #0f1115;
      -webkit-box-shadow: 0 0 0 1000px rgba(240,245,255,0.95) inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    /* wordmark sizing — "Business Systems" width = "RESONATE" width */
    .wordmark-wrapper { display: inline-block; text-align: center; }
    .wordmark-resonate {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: clamp(3rem, 9vw, 5.5rem);
      letter-spacing: 0.18em;
      color: #fff;
      line-height: 1;
      display: block;
      text-transform: uppercase;
    }
    .wordmark-sub-row {
      display: flex;
      align-items: center;
      gap: 0;
      width: 100%;
      margin-top: 0.35em;
    }
    .wordmark-line { flex: 1; height: 1px; background: rgba(255,255,255,0.28); }
    .wordmark-sub {
      font-family: 'Fraunces', serif;
      font-weight: 400;
      font-size: clamp(0.7rem, 1.8vw, 0.95rem);
      letter-spacing: 0.38em;
      color: rgba(255,255,255,0.82);
      text-transform: uppercase;
      white-space: nowrap;
      padding: 0 1em;
    }

    /* Divider between email form and Google button */
    .pill-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
      color: rgba(255,255,255,0.28);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .pill-divider::before,
    .pill-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    /* Custom glassmorphism Google button */
    .pill-google-btn {
      width: 100%;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 9999px;
      padding: 13px 24px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.15s, border-color 0.15s;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .pill-google-btn:hover {
      background: rgba(255,255,255,0.16);
      border-color: rgba(255,255,255,0.28);
    }
    .pill-google-btn:active { transform: scale(0.97); }
    .pill-google-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Login error */
    .login-error {
      background: rgba(186,26,26,0.18);
      border: 1px solid rgba(186,26,26,0.35);
      color: #fca5a5;
      padding: 10px 18px;
      border-radius: 9999px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 13px;
      text-align: center;
      display: none;
    }
    .login-error--visible { display: block; }
  </style>
</head>
<body>

<!-- ── Video background ───────────────────────────────────── -->
<!-- bg-wrap is fixed+overflow:hidden; video inside is absolute.
     This is the canonical iOS Safari workaround for video backgrounds. -->
<div id="bg-wrap">
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="https://pub-e211b514f9d24671bfa2577d123c7544.r2.dev/ripple-loop.mp4" type="video/mp4">
  </video>
  <div id="bg-overlay"></div>
</div>

<!-- ── iOS video fallback: if video hasn't started in 2 s, rely on bg-wrap #0a1628 ── -->
<script>
(function () {
  var video = document.getElementById('bg-video');
  var started = false;
  video.addEventListener('canplay', function () { started = true; }, { once: true });
  setTimeout(function () {
    if (!started) {
      // Video stalled — bg-wrap already shows #0a1628, just fade in a dark overlay
      video.style.display = 'none';
    }
  }, 2000);
})();
</script>

<!-- ── Login UI ───────────────────────────────────────────── -->
<div style="position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px;">

  <!-- Wordmark above card -->
  <div class="wordmark-wrapper" style="margin-bottom: 2rem;">
    <span class="wordmark-resonate">Resonate</span>
    <div class="wordmark-sub-row">
      <div class="wordmark-line"></div>
      <span class="wordmark-sub">Business Systems</span>
      <div class="wordmark-line"></div>
    </div>
  </div>

  <!-- Glassmorphism card -->
  <div class="glass-card" style="width:100%; max-width:400px; padding:2.5rem; border-radius:1.5rem; box-shadow:0 24px 64px rgba(0,0,0,0.4);">

    <!-- Shown when an active D1-confirmed session is detected -->
    <div id="session-panel" style="display:none; text-align:center;">
      <div style="font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.08em; color:rgba(255,255,255,0.45); text-transform:uppercase; margin-bottom:1rem;">
        Active session
      </div>
      <div id="session-label" style="font-family:'Plus Jakarta Sans',sans-serif; font-size:15px; color:rgba(255,255,255,0.9); margin-bottom:1.75rem; word-break:break-all;"></div>

      <button
        id="continue-btn"
        style="width:100%; background:#005b96; color:#fff; border:none; border-radius:9999px; padding:15px 24px; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:600; letter-spacing:0.04em; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:12px; transition:background 0.15s, transform 0.1s;"
        onmouseover="this.style.background='#004370'"
        onmouseout="this.style.background='#005b96'"
        onmousedown="this.style.transform='scale(0.97)'"
        onmouseup="this.style.transform='scale(1)'"
      >
        Continue to Dashboard
        <span class="material-symbols-outlined" style="font-size:18px;">arrow_forward</span>
      </button>

      <button
        id="session-signout-btn"
        style="width:100%; background:transparent; color:rgba(255,255,255,0.45); border:1px solid rgba(255,255,255,0.18); border-radius:9999px; padding:12px 24px; font-family:'Plus Jakarta Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:color 0.15s, border-color 0.15s;"
        onmouseover="this.style.color='rgba(255,255,255,0.75)'; this.style.borderColor='rgba(255,255,255,0.35)';"
        onmouseout="this.style.color='rgba(255,255,255,0.45)'; this.style.borderColor='rgba(255,255,255,0.18)';"
      >
        Sign out
      </button>
    </div>

    <!-- Login form — hidden while session check is in flight, shown if no session -->
    <div id="login-error" class="login-error" style="margin-bottom:1.25rem;"></div>

    <form id="login-form" style="display:none;">
      <div style="margin-bottom:1rem;">
        <label style="display:block; font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.06em; color:rgba(255,255,255,0.55); text-transform:uppercase; margin-bottom:8px; padding-left:4px;">
          Email
        </label>
        <input id="email" type="email" class="pill-input" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div style="margin-bottom:1.5rem;">
        <label style="display:block; font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:600; letter-spacing:0.06em; color:rgba(255,255,255,0.55); text-transform:uppercase; margin-bottom:8px; padding-left:4px;">
          Password
        </label>
        <input id="password" type="password" class="pill-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button
        id="login-btn"
        type="submit"
        style="width:100%; background:#005b96; color:#fff; border:none; border-radius:9999px; padding:15px 24px; font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; font-weight:600; letter-spacing:0.04em; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:background 0.15s, transform 0.1s;"
        onmouseover="this.style.background='#004370'"
        onmouseout="this.style.background='#005b96'"
        onmousedown="this.style.transform='scale(0.97)'"
        onmouseup="this.style.transform='scale(1)'"
      >
        Sign In
        <span class="material-symbols-outlined" style="font-size:18px; font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;">arrow_forward</span>
      </button>

      <!-- Divider -->
      <div class="pill-divider"><span id="divider-or">or</span></div>

      <!-- Custom glassmorphism Google button -->
      <button id="google-btn" type="button" class="pill-google-btn">
        <!-- Google "G" logo SVG -->
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        <span id="google-btn-text">Continue with Google</span>
      </button>
    </form>

  </div>

  <!-- Subtle footer -->
  <p style="margin-top:2rem; font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; letter-spacing:0.08em; color:rgba(255,255,255,0.28); text-transform:uppercase;">
    Resonate Business Systems © 2025
  </p>
</div>

<!-- ── Firebase auth logic ────────────────────────────────── -->
<script type="module">
  import { signIn, signOut, signInWithGoogle, getProfile } from './js/auth.js';

  const form        = document.getElementById('login-form');
  const btn         = document.getElementById('login-btn');
  const errEl       = document.getElementById('login-error');
  const sessionPanel= document.getElementById('session-panel');
  const sessionLabel= document.getElementById('session-label');
  const continueBtn = document.getElementById('continue-btn');
  const signoutBtn  = document.getElementById('session-signout-btn');
  const googleBtn   = document.getElementById('google-btn');

  // Detect browser language for Google button label and divider text
  if (navigator.language?.startsWith('pt')) {
    const t = document.getElementById('google-btn-text');
    if (t) t.textContent = 'Entrar com Google';
    const d = document.getElementById('divider-or');
    if (d) d.textContent = 'ou';
  }

  function destFor(role) {
    return role === 'admin'
      ? '/resonate-portal/dashboard.html'
      : '/resonate-portal/portal.html';
  }

  // ── On page load: check for an existing D1-confirmed session ──
  // getProfile() calls the Worker's /api/me — only resolves with a
  // profile if Firebase token is valid AND the user is in D1.
  // Never auto-redirect: show the resume panel so the user stays in control.
  getProfile().then(profile => {
    if (!profile) {
      // No valid session — show the login form
      form.style.display = '';
      return;
    }
    // Valid D1-confirmed session: show resume panel, never auto-redirect
    sessionLabel.textContent = `${profile.email} · ${profile.role}`;
    continueBtn.onclick = () => { window.location.href = destFor(profile.role); };
    sessionPanel.style.display = '';
  }).catch(() => {
    // Worker unreachable or session invalid — show login form
    form.style.display = '';
  });

  // ── Sign out from the session panel ───────────────────────────
  signoutBtn.addEventListener('click', async () => {
    signoutBtn.disabled = true;
    signoutBtn.textContent = 'Signing out…';
    try { await signOut(); } catch {}
    sessionPanel.style.display = 'none';
    form.style.display = '';
    errEl.classList.remove('login-error--visible');
  });

  // ── Google Sign In ────────────────────────────────────────────
  googleBtn.addEventListener('click', async () => {
    googleBtn.disabled = true;
    const originalContent = googleBtn.innerHTML;
    document.getElementById('google-btn-text').textContent =
      navigator.language?.startsWith('pt') ? 'Entrando…' : 'Signing in…';
    errEl.classList.remove('login-error--visible');

    try {
      const profile = await signInWithGoogle();
      window.location.href = destFor(profile.role);
    } catch (err) {
      if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') {
        let msg = 'Google sign-in failed. Please try again.';
        if (err.message?.includes('not registered')) msg = err.message;
        errEl.textContent = msg;
        errEl.classList.add('login-error--visible');
      }
      googleBtn.disabled = false;
      googleBtn.innerHTML = originalContent;
    }
  });

  // ── Login form submit ─────────────────────────────────────────
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    btn.disabled  = true;
    btn.innerHTML = 'Signing in… <span class="material-symbols-outlined" style="font-size:18px;">sync</span>';
    errEl.classList.remove('login-error--visible');

    try {
      const profile = await signIn(email, password);
      window.location.href = destFor(profile.role);
    } catch (err) {
      let msg = 'Incorrect email or password. Please try again.';
      if (err.message?.includes('not registered')) msg = err.message;
      errEl.textContent = msg;
      errEl.classList.add('login-error--visible');
      btn.disabled  = false;
      btn.innerHTML = 'Sign In <span class="material-symbols-outlined" style="font-size:18px;">arrow_forward</span>';
    }
  });
</script>
</body>
</html>
