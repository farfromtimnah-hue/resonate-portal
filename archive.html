<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive — Resonate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Newsreader:opsz,wght@6..72,700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-container":    "#005b96",
            "primary-fixed-dim":    "#9ccaff",
            "on-primary-fixed":     "#001d35",
            "inverse-surface":      "#2e3135",
            "outline-variant":      "#c1c7d1",
            "on-primary":           "#ffffff",
            "tertiary-fixed-dim":   "#ffb781",
            "secondary-fixed-dim":  "#c5c6d1",
          },
          borderRadius: { "full": "9999px", "DEFAULT": "1rem", "lg": "2rem" },
          fontFamily: { "jakarta": ["Plus Jakarta Sans","sans-serif"], "newsreader": ["Newsreader","serif"] },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/app.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f1115; color: #c1c7d1; }
    .glass-header { background: rgba(26,29,38,0.85); backdrop-filter: blur(12px); }
    #archive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-top: 8px; }
    @media (max-width: 640px) { #archive-grid { grid-template-columns: 1fr; } }
    .bg-glow-1 { position:fixed; top:-10%; right:-10%; width:500px; height:500px; background:#004370; border-radius:9999px; filter:blur(120px); opacity:0.18; pointer-events:none; z-index:0; }
    .bg-glow-2 { position:fixed; bottom:-10%; left:-10%; width:400px; height:400px; background:#663300; border-radius:9999px; filter:blur(100px); opacity:0.12; pointer-events:none; z-index:0; }
  </style>
</head>
<body class="min-h-screen antialiased">

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- ── Top Nav ─────────────────────────────────────────────── -->
<header class="glass-header sticky top-0 z-50 border-b border-white/5">
  <div class="flex justify-between items-center w-full px-6 md:px-12 max-w-[1200px] mx-auto h-20">
    <div class="flex items-center gap-10">
      <a href="/resonate-portal/dashboard.html"
         class="font-newsreader font-bold text-[22px] tracking-tight text-primary-fixed-dim no-underline"
         style="font-family:'Newsreader',serif; letter-spacing:-0.02em;">
        Resonate
      </a>
      <nav class="hidden md:flex items-center gap-1">
        <a href="/resonate-portal/dashboard.html"
           class="px-4 py-2 rounded-full text-outline-variant hover:text-primary-fixed-dim text-[13px] transition-colors">
          Dashboard
        </a>
        <a href="/resonate-portal/archive.html"
           class="px-4 py-2 rounded-full text-primary-fixed-dim font-semibold text-[13px] bg-primary-container/10 border border-primary-fixed-dim/15">
          Archive
        </a>
      </nav>
    </div>
    <button id="signout-btn"
            class="text-outline-variant hover:text-primary-fixed-dim text-[12px] uppercase tracking-widest transition-colors px-4 py-2 rounded-full">
      Sign Out
    </button>
  </div>
</header>

<!-- ── Main ───────────────────────────────────────────────── -->
<main class="relative z-10 max-w-[1200px] mx-auto px-6 md:px-12 py-12 space-y-10">

  <!-- Header -->
  <div>
    <h1 class="text-[28px] font-bold text-primary-fixed-dim tracking-tight" style="letter-spacing:-0.02em;">Archive</h1>
    <p class="text-outline-variant text-[13px] mt-1">Past clients — all data preserved, nothing deleted.</p>
  </div>

  <!-- Stat pills -->
  <section class="grid grid-cols-2 md:grid-cols-3 gap-4">
    <div class="bg-inverse-surface p-6 rounded-lg border border-white/5 space-y-2">
      <p class="text-outline-variant text-[11px] uppercase font-semibold tracking-widest">Total Archived</p>
      <h2 id="stat-total" class="text-primary-fixed-dim text-[32px] font-bold tracking-tight" style="letter-spacing:-0.02em;">—</h2>
    </div>
    <div class="bg-inverse-surface p-6 rounded-lg border border-white/5 space-y-2">
      <p class="text-outline-variant text-[11px] uppercase font-semibold tracking-widest">Completed Projects</p>
      <h2 id="stat-projects" class="text-tertiary-fixed-dim text-[32px] font-bold tracking-tight" style="letter-spacing:-0.02em;">—</h2>
    </div>
    <div class="bg-inverse-surface p-6 rounded-lg border border-white/5 space-y-2 col-span-2 md:col-span-1">
      <p class="text-outline-variant text-[11px] uppercase font-semibold tracking-widest">Status</p>
      <h2 class="text-secondary-fixed-dim text-[32px] font-bold tracking-tight" style="letter-spacing:-0.02em;">Inactive</h2>
    </div>
  </section>

  <!-- Search -->
  <section class="flex items-center gap-4">
    <div class="relative w-full md:w-80">
      <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-outline-variant text-[18px]">search</span>
      <input id="search" type="search"
             class="w-full bg-inverse-surface border-none rounded-full py-3 pl-12 pr-5 text-primary-fixed-dim text-[14px] placeholder:text-outline-variant focus:ring-1 focus:ring-primary-fixed-dim/40 outline-none"
             placeholder="Search archived clients…">
    </div>
  </section>

  <!-- Archive grid — rendered by archive.js -->
  <div id="archive-grid">
    <div class="loading">Loading…</div>
  </div>

  <!-- Footer -->
  <footer class="flex justify-between items-center pt-8 border-t border-white/5">
    <p class="text-outline-variant text-[11px] uppercase tracking-widest">© 2025 Resonate Business Systems</p>
    <a href="/resonate-portal/dashboard.html"
       class="text-outline-variant text-[12px] uppercase tracking-widest hover:text-primary-fixed-dim transition-colors flex items-center gap-2 group">
      <span class="material-symbols-outlined text-[16px] transition-transform group-hover:-translate-x-1">arrow_back</span>
      Back to Dashboard
    </a>
  </footer>

</main>

<script type="module" src="js/archive.js"></script>

<!-- Compute stats after archive.js loads -->
<script type="module">
  // Stats are populated by archive.js when clients load.
  // We hook in after a short delay to read the rendered count.
  // (The archive.js render() function inserts cards; we count them.)
  const observer = new MutationObserver(() => {
    const cards = document.querySelectorAll('#archive-grid .archive-card');
    if (cards.length) {
      document.getElementById('stat-total').textContent = cards.length;
      observer.disconnect();
    }
  });
  observer.observe(document.getElementById('archive-grid'), { childList: true, subtree: true });
</script>
</body>
</html>
