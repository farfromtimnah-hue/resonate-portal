# ============================================================
# Cloudflare Worker — Resonate Business Systems Client Portal API
# Deploy: cd worker && wrangler deploy
# ============================================================

name               = "resonate-portal-api"
main               = "src/index.js"
compatibility_date = "2024-09-23"

# ----------------------------------------------------------
# D1 Database binding
# ----------------------------------------------------------
[[d1_databases]]
binding       = "DB"
database_name = "resonate-portal"
database_id   = "c3cb0599-5cf6-4b5c-95e2-bb305bc03fc7"

# ----------------------------------------------------------
# R2 Bucket binding (for logo uploads)
# Create the bucket first: wrangler r2 bucket create resonate-logos
# Then deploy. The bucket name below must match exactly.
# ----------------------------------------------------------
[[r2_buckets]]
binding     = "BUCKET"
bucket_name = "resonate-logos"

# ----------------------------------------------------------
# Workers AI binding (Whisper transcription for the intake interview)
# ----------------------------------------------------------
[ai]
binding = "AI"

# ----------------------------------------------------------
# Environment variables
# ----------------------------------------------------------
[vars]
FIREBASE_PROJECT_ID = "resonate-portal"
# Comma-separated allowlist; the Worker echoes the matching request Origin
CORS_ORIGIN         = "https://farfromtimnah-hue.github.io,https://portal.resonateai.online"
BUCKET_PUBLIC_URL   = "https://pub-cec1d75467e245eb85ad5c1a9955a3e2.r2.dev"
# Where the Zoho OAuth callback sends the admin back to. Update to
# https://portal.resonateai.online once the custom domain is verified live.
PORTAL_URL          = "https://farfromtimnah-hue.github.io/resonate-portal"
# Firebase Web API key — found in Firebase Console → Project Settings → General → Web API Key
# Required for automatic Firebase account creation in Add Client flow (Item 11)
FIREBASE_API_KEY = "AIzaSyA3YWrys408IlbeViOyzgKDmOlfauM7N30"

