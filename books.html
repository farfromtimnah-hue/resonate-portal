<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Books — Resonate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Newsreader:opsz,wght@6..72,700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-container":    "#005b96",
            "primary-fixed-dim":    "#9ccaff",
            "on-primary-fixed":     "#001d35",
            "inverse-surface":      "#2e3135",
            "outline-variant":      "#c1c7d1",
            "on-primary":           "#ffffff",
            "surface-variant":      "#e1e2e8",
            "tertiary-fixed-dim":   "#ffb781",
            "secondary-fixed-dim":  "#c5c6d1",
            "on-primary-container": "#abd2ff",
          },
          borderRadius: { "full": "9999px", "DEFAULT": "1rem", "lg": "2rem" },
          fontFamily:   { "jakarta": ["Plus Jakarta Sans","sans-serif"], "newsreader": ["Newsreader","serif"] },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/app.css">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f1115; color: #c1c7d1; }
    .glass-header { background: rgba(26,29,38,0.85); backdrop-filter: blur(12px); }
    .bg-glow-1 { position:fixed; top:-10%; right:-10%; width:500px; height:500px; background:#004370; border-radius:9999px; filter:blur(120px); opacity:0.18; pointer-events:none; z-index:0; }
    .bg-glow-2 { position:fixed; bottom:-10%; left:-10%; width:400px; height:400px; background:#663300; border-radius:9999px; filter:blur(100px); opacity:0.12; pointer-events:none; z-index:0; }
    /* Books tabs — same visual language as the portal tabs, dark theme */
    .books-tab {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 12px; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      color: #717781;
      background: none; border: none; cursor: pointer;
      padding: 10px 18px; border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .books-tab:hover { color: #9ccaff; }
    .books-tab--active { color: #9ccaff; border-bottom-color: #005b96; }
    /* Invoice table rows */
    .invoice-row { display: grid; grid-template-columns: 1.4fr 1fr 0.9fr 0.7fr 0.7fr 0.9fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .invoice-row__head { color: #717781; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 8px 0; }
    @media (max-width: 760px) {
      .invoice-row { grid-template-columns: 1fr auto; }
      .invoice-row > .invoice-cell--optional { display: none; }
    }
  </style>
</head>
<body class="min-h-screen antialiased">

<div class="bg-glow-1"></div>
<div class="bg-glow-2"></div>

<!-- ── Mobile Nav Overlay + Drawer ─────────────────────────── -->
<div id="mobile-nav-overlay" class="mobile-nav-overlay"></div>
<div id="mobile-nav-drawer" class="mobile-nav-drawer">
  <a href="dashboard.html" class="mobile-nav-drawer__brand">Resonate</a>
  <a href="dashboard.html" class="mobile-nav-drawer__link">
    <span class="material-symbols-outlined">grid_view</span>Dashboard
  </a>
  <a href="books.html" class="mobile-nav-drawer__link mobile-nav-drawer__link--active">
    <span class="material-symbols-outlined">receipt_long</span>Books
  </a>
  <a href="archive.html" class="mobile-nav-drawer__link">
    <span class="material-symbols-outlined">archive</span>Archive
  </a>
</div>

<!-- ── Top Nav ─────────────────────────────────────────────── -->
<header class="glass-header sticky top-0 z-50 border-b border-white/5">
  <div class="flex justify-between items-center w-full px-6 md:px-12 max-w-[1200px] mx-auto h-20">
    <div class="flex items-center gap-3 md:gap-10">
      <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open navigation">
        <span class="material-symbols-outlined" style="font-size:22px;">menu</span>
      </button>
      <a href="dashboard.html"
         class="font-newsreader font-bold text-[22px] tracking-tight text-primary-fixed-dim no-underline"
         style="font-family:'Newsreader',serif; letter-spacing:-0.02em;">
        Resonate
      </a>
      <nav class="hidden md:flex items-center gap-1">
        <a href="dashboard.html"
           class="px-4 py-2 rounded-full text-outline-variant hover:text-primary-fixed-dim text-[13px] transition-colors">
          Dashboard
        </a>
        <a href="books.html"
           class="px-4 py-2 rounded-full text-primary-fixed-dim font-semibold text-[13px] bg-primary-container/10 border border-primary-fixed-dim/15">
          Books
        </a>
        <a href="archive.html"
           class="px-4 py-2 rounded-full text-outline-variant hover:text-primary-fixed-dim text-[13px] transition-colors">
          Archive
        </a>
      </nav>
    </div>

    <div class="flex items-center gap-3">
      <button id="signout-btn"
              class="text-outline-variant hover:text-primary-fixed-dim text-[12px] uppercase tracking-widest transition-colors px-4 py-2 rounded-full hidden md:block">
        Sign Out
      </button>
    </div>
  </div>
</header>

<script>
(function () {
  var btn     = document.getElementById('mobile-menu-btn');
  var drawer  = document.getElementById('mobile-nav-drawer');
  var overlay = document.getElementById('mobile-nav-overlay');
  function open()  { drawer.classList.add('mobile-nav-drawer--open');  overlay.classList.add('mobile-nav-overlay--open');  document.body.style.overflow='hidden'; }
  function close() { drawer.classList.remove('mobile-nav-drawer--open'); overlay.classList.remove('mobile-nav-overlay--open'); document.body.style.overflow=''; }
  btn.addEventListener('click', open);
  overlay.addEventListener('click', close);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') close(); });
})();
</script>

<!-- ── Main Content ────────────────────────────────────────── -->
<main class="relative z-10 max-w-[1200px] mx-auto px-6 md:px-12 py-12 space-y-8">

  <!-- Page title + actions -->
  <div class="flex items-start justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-[28px] font-bold text-primary-fixed-dim tracking-tight" style="letter-spacing:-0.02em;"
          data-i18n="books_title">Books &amp; Invoicing</h1>
      <p id="books-subtitle" class="text-outline-variant text-[13px] mt-1"></p>
    </div>
    <div class="flex items-center gap-3">
      <button id="sync-all-btn"
              class="flex items-center gap-1.5 text-outline-variant hover:text-primary-fixed-dim text-[12px] uppercase tracking-widest transition-colors px-4 py-2 rounded-full border border-white/10">
        <span class="material-symbols-outlined text-[15px]">sync</span>
        <span data-i18n="books_sync">Sync from Zoho</span>
      </button>
      <button id="new-invoice-btn"
              class="bg-primary-container text-white px-6 py-2 rounded-full text-[12px] font-semibold uppercase tracking-widest hover:opacity-90 transition-opacity flex items-center gap-2">
        <span class="material-symbols-outlined text-[16px]">add</span>
        <span data-i18n="books_new_invoice">New Invoice</span>
      </button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex items-center border-b border-white/5">
    <button id="books-tab-draft"   class="books-tab" data-tab="draft"><span data-i18n="books_tab_draft">Draft</span> <span id="count-draft" class="opacity-60"></span></button>
    <button id="books-tab-unpaid"  class="books-tab books-tab--active" data-tab="unpaid"><span data-i18n="books_tab_unpaid">Unpaid</span> <span id="count-unpaid" class="opacity-60"></span></button>
    <button id="books-tab-archive" class="books-tab" data-tab="archive"><span data-i18n="books_tab_archive">Archive</span> <span id="count-archive" class="opacity-60"></span></button>
  </div>

  <!-- Invoice list -->
  <section class="bg-inverse-surface rounded-lg border border-white/5 p-6">
    <div class="invoice-row invoice-row__head">
      <span data-i18n="books_col_client">Client</span>
      <span data-i18n="books_col_invoice">Invoice</span>
      <span data-i18n="books_col_status">Status</span>
      <span class="invoice-cell--optional" data-i18n="books_col_amount">Amount</span>
      <span class="invoice-cell--optional" data-i18n="books_col_balance">Balance</span>
      <span class="invoice-cell--optional" data-i18n="books_col_due">Due Date</span>
      <span></span>
    </div>
    <div id="invoices-list"></div>
    <div id="invoices-empty" class="text-outline-variant text-[13px] py-8 text-center hidden"></div>
    <div id="invoices-loading" class="loading">Loading…</div>
  </section>

</main>

<!-- ── New Invoice Modal ───────────────────────────────────── -->
<div id="modal-new-invoice" class="modal">
  <div class="modal__box" style="max-width:640px;">
    <div class="modal__head">
      <span class="modal__title" data-i18n="books_new_invoice">New Invoice</span>
      <button type="button" class="modal__close" data-close="modal-new-invoice">✕</button>
    </div>
    <div class="modal__body">
      <div id="ni-error" style="display:none; background:#fee2e2; color:#b91c1c;
           border-radius:.5rem; padding:.75rem 1rem; font-size:13px; margin-bottom:1rem;
           font-family:'Plus Jakarta Sans',sans-serif;"></div>
      <div class="form-group">
        <label class="form-label" data-i18n="inv_form_client">Client</label>
        <select id="ni-client" class="form-control"></select>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="inv_form_line_items">Line Items</label>
        <div id="ni-items" class="flex flex-col gap-2"></div>
        <button id="ni-add-item-btn" type="button"
                style="background:none; border:none; cursor:pointer; padding:6px 0 0; display:flex; align-items:center; gap:4px;
                       font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:600;
                       letter-spacing:.06em; text-transform:uppercase; color:rgba(193,199,209,0.5);"
                onmouseover="this.style.color='#9ccaff'" onmouseout="this.style.color='rgba(193,199,209,0.5)'">
          <span class="material-symbols-outlined" style="font-size:13px;">add</span>
          <span data-i18n="inv_form_add_item">Add Item</span>
        </button>
      </div>
      <div class="flex justify-end items-baseline gap-3" style="padding:4px 0 12px; border-top:1px solid rgba(255,255,255,0.08); margin-top:4px;">
        <span class="text-outline-variant text-[11px] uppercase tracking-widest" data-i18n="inv_form_total">Total</span>
        <span id="ni-total" class="text-primary-fixed-dim text-[18px] font-bold">$0.00</span>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" data-i18n="inv_form_due_date">Due date</label>
          <input id="ni-due" type="date" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label" data-i18n="inv_form_notes">Notes (optional)</label>
          <input id="ni-notes" type="text" class="form-control" placeholder="">
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-close="modal-new-invoice" data-i18n="cancel">Cancel</button>
      <button id="ni-save-btn" class="btn btn--primary" data-i18n="inv_create">Create Draft</button>
    </div>
  </div>
</div>

<!-- ── Edit Draft Invoice Modal ────────────────────────────── -->
<div id="modal-edit-invoice" class="modal">
  <div class="modal__box" style="max-width:640px;">
    <div class="modal__head">
      <span class="modal__title"><span data-i18n="inv_edit_title">Edit Draft Invoice</span> <span id="ei-number" class="text-outline-variant text-[13px]"></span></span>
      <button type="button" class="modal__close" data-close="modal-edit-invoice">✕</button>
    </div>
    <div class="modal__body">
      <div id="ei-error" style="display:none; background:#fee2e2; color:#b91c1c;
           border-radius:.5rem; padding:.75rem 1rem; font-size:13px; margin-bottom:1rem;
           font-family:'Plus Jakarta Sans',sans-serif;"></div>
      <div class="form-group">
        <label class="form-label" data-i18n="inv_form_line_items">Line Items</label>
        <div id="ei-items" class="flex flex-col gap-2"></div>
        <button id="ei-add-item-btn" type="button"
                style="background:none; border:none; cursor:pointer; padding:6px 0 0; display:flex; align-items:center; gap:4px;
                       font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:600;
                       letter-spacing:.06em; text-transform:uppercase; color:rgba(193,199,209,0.5);"
                onmouseover="this.style.color='#9ccaff'" onmouseout="this.style.color='rgba(193,199,209,0.5)'">
          <span class="material-symbols-outlined" style="font-size:13px;">add</span>
          <span data-i18n="inv_form_add_item">Add Item</span>
        </button>
      </div>
      <div class="flex justify-end items-baseline gap-3" style="padding:4px 0 4px; border-top:1px solid rgba(255,255,255,0.08); margin-top:4px;">
        <span class="text-outline-variant text-[11px] uppercase tracking-widest" data-i18n="inv_form_total">Total</span>
        <span id="ei-total" class="text-primary-fixed-dim text-[18px] font-bold">$0.00</span>
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-close="modal-edit-invoice" data-i18n="cancel">Cancel</button>
      <button id="ei-save-btn" class="btn btn--primary" data-i18n="inv_save_items">Save Changes</button>
    </div>
  </div>
</div>

<script type="module" src="js/books.js?v=3"></script>
</body>
</html>
