<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Your Project Portal — Resonate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Newsreader:opsz,wght@6..72,700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          borderRadius: { "full": "9999px", "DEFAULT": "1rem", "lg": "2rem" },
          fontFamily: { "jakarta": ["Plus Jakarta Sans","sans-serif"], "newsreader": ["Newsreader","serif"] },
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/app.css?v=4">

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8F7F4; color: #414750; }
  </style>
</head>
<body class="min-h-screen antialiased">

<!-- ── Portal Header ────────────────────────────────────────── -->
<header class="sticky top-0 z-50 bg-white/90 backdrop-blur-sm border-b border-black/5">
  <div class="max-w-[860px] mx-auto px-6 h-16 flex items-center justify-between">

    <!-- Brand -->
    <span class="font-newsreader font-bold text-[20px] text-[#001d35]"
          style="font-family:'Newsreader',serif; letter-spacing:-0.02em;">
      Resonate
    </span>

    <!-- Right side: lang toggle + account actions -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-1">
        <button id="lang-en" class="lang-btn lang-btn--active">EN</button>
        <button id="lang-pt" class="lang-btn">PT</button>
      </div>
      <div style="width:1px; height:18px; background:rgba(0,0,0,0.1);"></div>
      <button id="change-password-btn"
              style="font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:600;
                     letter-spacing:0.06em; text-transform:uppercase; color:#717781;
                     background:none; border:none; cursor:pointer; padding:4px 8px; border-radius:6px;
                     transition:color 0.15s;"
              onmouseover="this.style.color='#001d35'" onmouseout="this.style.color='#717781'"
              data-i18n="change_password">
        Change Password
      </button>
      <button id="signout-btn"
              style="font-family:'Plus Jakarta Sans',sans-serif; font-size:11px; font-weight:600;
                     letter-spacing:0.06em; text-transform:uppercase; color:#717781;
                     background:none; border:none; cursor:pointer; padding:4px 8px; border-radius:6px;
                     transition:color 0.15s;"
              onmouseover="this.style.color='#001d35'" onmouseout="this.style.color='#717781'"
              data-i18n="sign_out">
        Sign Out
      </button>
    </div>

  </div>
</header>

<!-- ── Main Content ─────────────────────────────────────────── -->
<main class="max-w-[860px] mx-auto px-6 py-8">

  <!-- Loading -->
  <div id="loading" class="loading">Loading your projects…</div>

  <!-- Content (hidden until loaded) -->
  <div id="content" class="hidden">

    <!-- Identity: logo / wordmark + greeting — single flex row -->
    <div class="pb-5 mb-4 border-b border-black/5">
      <div class="portal-identity-row">
        <div id="portal-logo-area"></div>
        <p id="portal-greeting" class="portal-greeting"></p>
      </div>
    </div>

    <!-- Welcome message -->
    <p id="portal-welcome-msg" class="portal-welcome-msg"></p>

    <!-- Progress (hidden when no projects) -->
    <div id="portal-progress-section" class="bg-white rounded-lg border border-black/5 p-6 shadow-sm mb-5">
      <p class="text-[#717781] text-[11px] uppercase font-semibold tracking-widest mb-4"
         data-i18n="portal_status_heading">Project Status</p>
      <div id="portal-progress-counts" class="progress-counts"></div>
      <div class="progress-bar mt-4">
        <div id="portal-progress-fill" class="progress-bar__fill" style="width:0%"></div>
      </div>
    </div>

    <!-- Projects + Vision tab card -->
    <div class="bg-white rounded-lg border border-black/5 shadow-sm mb-5 overflow-hidden">

      <!-- Tab nav -->
      <div class="portal-tabs pt-2">
        <button id="tab-btn-projects" class="portal-tab portal-tab--active"
                data-i18n="portal_tab_projects">Projects</button>
        <button id="tab-btn-vision" class="portal-tab"
                data-i18n="portal_tab_vision">Vision</button>
      </div>

      <!-- Projects panel -->
      <div id="tab-panel-projects" class="p-6">
        <div id="portal-projects" class="project-list"></div>
      </div>

      <!-- Vision panel -->
      <div id="tab-panel-vision" class="p-6 hidden">
        <p id="portal-vision-copy" class="vision-copy"></p>
        <p class="vision-copy-signature">Resonate</p>
        <!-- Space for future vision content (goals, milestones, etc.) -->
        <div id="portal-vision-extras" class="mt-8"></div>
      </div>

    </div>

    <!-- Messages -->
    <div class="bg-white rounded-lg border border-black/5 p-6 shadow-sm mb-5">
      <p class="text-[#717781] text-[11px] uppercase font-semibold tracking-widest mb-4"
         data-i18n="section_comments">Messages</p>
      <div id="portal-comments" class="comment-list" style="margin-bottom:16px;"></div>
      <div class="comment-form">
        <label class="form-label" style="display:block; margin-bottom:6px;"
               data-i18n="portal_message_us">Send a Message</label>
        <textarea id="portal-comment-input" class="form-control" rows="3"
                  data-i18n-ph="portal_message_placeholder"
                  placeholder="Type your message here…"></textarea>
        <div style="display:flex; justify-content:flex-end; margin-top:8px;">
          <button id="portal-send-btn" class="btn btn--primary">
            <span data-i18n="send_message">Send</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Get in Touch -->
    <div class="bg-white rounded-lg border border-black/5 p-6 shadow-sm mb-5">
      <p class="text-[#717781] text-[11px] uppercase font-semibold tracking-widest mb-4"
         data-i18n="portal_contact_heading">Get in Touch</p>
      <div id="portal-contact-actions" class="contact-actions"></div>
    </div>

  </div><!-- /content -->

  <!-- First-login: set your password (shown instead of portal content) -->
  <div id="first-login-panel" class="hidden" style="max-width:400px; margin:3rem auto; text-align:center;">
    <div style="font-size:2rem; margin-bottom:1rem;">🔑</div>
    <h2 style="font-family:'Plus Jakarta Sans',sans-serif; font-size:20px; font-weight:700;
               color:#001d35; margin-bottom:.5rem;">Set Your Password</h2>
    <p style="font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; color:#717781;
              margin-bottom:2rem; line-height:1.6;">
      Welcome! Please create a secure password for your account before accessing your portal.
    </p>
    <div id="first-login-error" style="display:none; background:#fee2e2; color:#b91c1c;
         border-radius:.5rem; padding:.75rem 1rem; font-size:13px; margin-bottom:1rem;
         font-family:'Plus Jakarta Sans',sans-serif; text-align:left;"></div>
    <div style="display:flex; flex-direction:column; gap:.75rem; text-align:left;">
      <div>
        <label style="display:block; font-family:'Plus Jakarta Sans',sans-serif; font-size:11px;
                      font-weight:600; letter-spacing:.06em; text-transform:uppercase;
                      color:#717781; margin-bottom:6px;">New Password</label>
        <input id="first-new-password" type="password" class="form-control"
               placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <div>
        <label style="display:block; font-family:'Plus Jakarta Sans',sans-serif; font-size:11px;
                      font-weight:600; letter-spacing:.06em; text-transform:uppercase;
                      color:#717781; margin-bottom:6px;">Confirm Password</label>
        <input id="first-confirm-password" type="password" class="form-control"
               placeholder="Repeat your new password" autocomplete="new-password">
      </div>
      <button id="first-login-save-btn" class="btn btn--primary" style="margin-top:.5rem;">
        Set Password &amp; Continue
      </button>
    </div>
  </div>

</main>

<!-- Subtle footer band -->
<footer class="border-t border-black/5 py-5">
  <p class="text-center text-[11px] text-[#a0a4ae] uppercase tracking-widest">
    © 2025 Resonate Business Systems
  </p>
</footer>

<!-- Change Password Modal -->
<div id="modal-change-password" class="modal">
  <div class="modal__box" style="max-width:400px;">
    <div class="modal__head">
      <span class="modal__title">Change Password</span>
      <button type="button" class="modal__close" data-close="modal-change-password">✕</button>
    </div>
    <div class="modal__body">
      <div id="cp-error" style="display:none; background:#fee2e2; color:#b91c1c;
           border-radius:.5rem; padding:.75rem 1rem; font-size:13px; margin-bottom:1rem;
           font-family:'Plus Jakarta Sans',sans-serif;"></div>
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input id="cp-current" type="password" class="form-control"
               placeholder="Your current password" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input id="cp-new" type="password" class="form-control"
               placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input id="cp-confirm" type="password" class="form-control"
               placeholder="Repeat your new password" autocomplete="new-password">
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-close="modal-change-password">Cancel</button>
      <button id="cp-save-btn" class="btn btn--primary">Update Password</button>
    </div>
  </div>
</div>

<script type="module" src="js/portal.js?v=10"></script>
</body>
</html>
